[project]
name = "trade-calendar-api"
version = "0.1.0"
description = "Single-user dynamic trading event calendar API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "apscheduler>=3.11,<4",
  "fastapi>=0.116,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "icalendar>=6.3,<7",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "pymupdf>=1.26,<2",
  "pyyaml>=6,<7",
  "selectolax>=0.4,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trade_calendar*"]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "fitz", "icalendar", "yaml"]
ignore_missing_imports = true
